<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Skuld: Arrival</title>
  <desc id="desc">A quiet red horizon, rain, and a thread of light connecting yesterday to tomorrow.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#f9f4eb"/><stop offset="1" stop-color="#e8ded0"/></linearGradient>
    <linearGradient id="horizon" x2="0" y2="1"><stop stop-color="#67332f"/><stop offset="1" stop-color="#291f22"/></linearGradient>
    <linearGradient id="thread" x2="1" y2="0"><stop stop-color="#a1372f" stop-opacity=".15"/><stop offset=".52" stop-color="#b92d25"/><stop offset="1" stop-color="#e7a06b"/></linearGradient>
    <pattern id="rain" width="41" height="67" patternUnits="userSpaceOnUse" patternTransform="skewX(-16)"><path d="M9 2v17M33 40v15" stroke="#8d7770" stroke-opacity=".18" stroke-width="1.3"/></pattern>
  </defs>
  <rect width="1200" height="500" fill="url(#sky)"/>
  <rect width="1200" height="500" fill="url(#rain)"/>
  <path d="M0 356C183 331 300 396 482 357s328-53 718 7v136H0z" fill="url(#horizon)"/>
  <path d="M0 377C220 357 332 411 520 382s335-44 680 1" fill="none" stroke="#e6b09a" stroke-opacity=".32" stroke-width="2"/>
  <path d="M675 333c97-32 166-45 254-21 64 18 131 18 201-18" fill="none" stroke="url(#thread)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="930" cy="312" r="8" fill="#ba342b"/><circle cx="930" cy="312" r="25" fill="none" stroke="#b84036" stroke-opacity=".35"/>
  <text x="74" y="146" fill="#302824" font-family="Georgia,serif" font-size="72" letter-spacing="8">SKULD</text>
  <text x="80" y="213" fill="#a43b34" font-family="Georgia,serif" font-size="35" letter-spacing="5">ARRIVAL</text>
  <path d="M81 246h270" stroke="#aa8276" stroke-width="1"/>
  <text x="80" y="293" fill="#5d534c" font-family="Segoe UI,Arial,sans-serif" font-size="24">Not an AI you open. An AI that stays.</text>
  <text x="80" y="330" fill="#785a50" font-family="Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="2">TIME TO LIVE</text>
</svg>
